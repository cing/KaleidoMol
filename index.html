<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christopher Ing - Kaleidoscope Art Demo</title>
    <link rel="stylesheet" href="kaleidoscope.css?v=20260204x" />
  </head>
  <body>
    <canvas id="kaleido" aria-label="Kaleidoscope rendering"></canvas>

    <div class="overlay">
      <div class="panel-top">
        <div class="panel-actions">
          <button
            class="controls-toggle"
            type="button"
            id="controls-toggle"
            aria-expanded="true"
          >
            hide
          </button>
          <button class="reset" type="button" id="control-reset">Reset</button>
        </div>
        <div class="panel-title">
          <p class="name">KaleidoMol</p>
          <p class="subtitle">Kaleidoscopic Protein Viewer</p>
        </div>
      </div>

      <div class="control-panel" role="group" aria-label="Kaleidoscope controls">

        <div class="control-sliders">
          <label class="control-row" for="control-slices">
            <span>Slices</span>
            <input
              id="control-slices"
              type="range"
              min="8"
              max="36"
              step="1"
              value="20"
            />
            <span class="value" id="control-slices-value">20</span>
          </label>
          <label class="control-row" for="control-zoom">
            <span>Zoom</span>
            <input
              id="control-zoom"
              type="range"
              min="1.0"
              max="3.0"
              step="0.05"
              value="1.9"
            />
            <span class="value" id="control-zoom-value">1.90</span>
          </label>
          <label class="control-row" for="control-speed">
            <span>Spin</span>
            <input
              id="control-speed"
              type="range"
              min="0"
              max="0.01"
              step="0.0005"
              value="0.0015"
            />
            <span class="value" id="control-speed-value">0.0015</span>
          </label>
        </div>

        <div class="control-field">
          <label for="control-pdb">PDB code</label>
          <div class="control-input">
            <input
              id="control-pdb"
              type="text"
              value="1cbs"
              maxlength="6"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="mini-button" type="button" id="control-pdb-load">
              Load
            </button>
            <button class="mini-button icon-button" type="button" id="control-save" aria-label="Save PNG">
              <span aria-hidden="true">💾</span>
            </button>
          </div>
        </div>

        <div
          class="representation-grid"
          role="radiogroup"
          aria-label="Representation"
        >
          <label class="toggle">
            <input
              id="rep-cartoon"
              type="radio"
              name="representation"
              value="cartoon"
              checked
            />
            <span>Cartoon</span>
          </label>
          <label class="toggle">
            <input
              id="rep-spacefill"
              type="radio"
              name="representation"
              value="spacefill"
            />
            <span>Spacefill</span>
          </label>
          <label class="toggle">
            <input
              id="rep-surface"
              type="radio"
              name="representation"
              value="molecular-surface"
            />
            <span>Surface</span>
          </label>
        </div>

        <div class="gradient-controls">
          <label class="gradient-control">
            <span>Foreground</span>
            <select id="foreground-gradient">
              <option value="default">Default</option>
              <option value="rainbow">Rainbow</option>
              <option value="atlas">Atlas</option>
              <option value="timber">Timber</option>
              <option value="sunset">Sunset</option>
              <option value="cool-blues">Cool Blues</option>
              <option value="purple-dream">Purple Dream</option>
              <option value="emerald-water">Emerald Water</option>
              <option value="juicy-orange">Juicy Orange</option>
              <option value="moonlit-asteroid">Moonlit Asteroid</option>
              <option value="mirage">Mirage</option>
            </select>
          </label>
          <label class="gradient-control">
            <span>Background</span>
            <select id="background-gradient">
              <option value="default">Default</option>
              <option value="black">Black</option>
              <option value="white">White</option>
              <option value="rainbow">Rainbow</option>
              <option value="atlas">Atlas</option>
              <option value="timber">Timber</option>
              <option value="sunset">Sunset</option>
              <option value="cool-blues">Cool Blues</option>
              <option value="purple-dream">Purple Dream</option>
              <option value="emerald-water">Emerald Water</option>
              <option value="juicy-orange">Juicy Orange</option>
              <option value="moonlit-asteroid">Moonlit Asteroid</option>
              <option value="mirage">Mirage</option>
            </select>
          </label>
        </div>

        <div class="control-field quick-styles">
          <label>Quick styles</label>
          <div class="toggle-grid">
            <label class="toggle">
              <input id="toggle-illustrative" type="checkbox" />
              <span>Illustrative</span>
            </label>
          </div>
        </div>

        <div class="toggle-grid">
          <label class="toggle">
            <input id="toggle-mirror" type="checkbox" checked />
            <span>Mirror</span>
          </label>
          <label class="toggle">
            <input id="toggle-spin" type="checkbox" checked />
            <span>Auto spin</span>
          </label>
          <label class="toggle">
            <input id="toggle-pulse" type="checkbox" />
            <span>Pulse</span>
          </label>
          <label class="toggle">
            <input id="toggle-drift" type="checkbox" checked />
            <span>Drift</span>
          </label>
          <label class="toggle">
            <input id="toggle-glow" type="checkbox" checked />
            <span>Glow</span>
          </label>
          <label class="toggle">
            <input id="toggle-audio" type="checkbox" />
            <span>Audio Drive</span>
          </label>
<label class="toggle">
            <input id="toggle-double" type="checkbox" />
            <span>Double layer</span>
          </label>
          <label class="toggle">
            <input id="toggle-trail" type="checkbox" />
            <span>Trails</span>
          </label>
        </div>

        <div class="panel-stats" aria-live="polite">
          <span id="stats-fps">FPS --</span>
          <span id="stats-mem">MEM --</span>
        </div>
      </div>
    </div>

    <div class="source">
      <iframe
        title="Mol* viewer source"
        src="story/viewer.html?v=20260204ae"
        loading="eager"
      ></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
    <script src="kaleidoscope.js?v=20260204x"></script>
  </body>
</html>
