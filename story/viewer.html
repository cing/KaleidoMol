        const applySnapshotKey = (key) => {

            const manager = plugin?.managers?.snapshot;
            if (manager?.applyKey) {
                manager.applyKey(key);
                return true;
            }
            return false;
        };

        let pendingSnapshotKey = null;
        let pendingSnapshotTries = 0;
        const queueSnapshotKey = (key) => {
            pendingSnapshotKey = key;
            pendingSnapshotTries = 0;
            tryApplySnapshot();
        };

        const tryApplySnapshot = () => {
            if (!pendingSnapshotKey) return;
            if (applySnapshotKey(pendingSnapshotKey)) {
                pendingSnapshotKey = null;
                return;
            }
            if (pendingSnapshotTries < 20) {
                pendingSnapshotTries += 1;
                setTimeout(tryApplySnapshot, 250);
            }
        };

        window.addEventListener('message', (event) => {
            const allowedOrigin = window.location.origin;
            if (allowedOrigin !== 'null' && event.origin !== allowedOrigin) return;
            const data = event.data || {};
            if (data.type === 'apply-snapshot' && typeof data.key === 'string') {
                queueSnapshotKey(data.key);
            }
        });
