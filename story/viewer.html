<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Christopher Ing - Molecular Field Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #viewer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
        }


        #controls {
            position: absolute;
            left: 66%;
            top: 0;
            right: 0;
            bottom: 0;
            padding: 16px;
            padding-bottom: 20px;
            border: 1px solid #ccc;
            border-left: none;
            background: #F6F5F3;
            z-index: -2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #links {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-family: "Raleway", "HelveticaNeue", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.6rem;
            z-index: -1;
            color: #666;
        }

        #links a {
            color: #666;
            text-decoration: none;
        }

        #links .sep {
            color: #aaa;
        }

        @media (orientation:portrait) {
            #viewer {
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
                bottom: 0;
            }

            #controls {
                display: none;
            }

            .msp-viewport-controls-buttons {
                display: none;
            }
        }

        #controls,
        #links {
            display: none;
        }

        .msp-viewport-controls-orientation,
        .msp-viewport-controls,
        .msp-viewport-controls-buttons,
        .msp-viewport-top,
        .msp-viewport-top-left,
        .msp-viewport-top-right,
        [class*="msp-viewport-controls"],
        [class*="msp-viewport-top"] {
            display: none !important;
        }

        #axis-cover {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 120px;
            height: 120px;
            background: #f5efe7;
            pointer-events: none;
            z-index: 2;
        }

        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/molstar@5.5.0/build/mvs-stories/mvs-stories.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/molstar@5.5.0/build/mvs-stories/mvs-stories.css" />
</head>
<body>
    <div id="viewer">
        <mvs-stories-viewer></mvs-stories-viewer>
        <div id="axis-cover" aria-hidden="true"></div>
        
    </div>
    <div id="controls">
        <mvs-stories-snapshot-markdown style="flex-grow: 1;"></ mvs-stories-snapshot-markdown>
    </div>

    <div id="links">
        
        <a href="#" id="mvs-data" title="MolViewSpec State for this story. Can be opened in the Mol* app.">Download MVS</a> <span class="sep">•</span>
        <a href="https://molstar.org/mol-view-stories/" id="mvs-data" target="_blank" rel="noopener noreferrer">Created with MolViewStories</a> <span class="sep">•</span>
        <a href="https://molstar.org" id="mvs-data" target="_blank" rel="noopener noreferrer">Mol*</a>
    </div>

    <script>
        
        const normalizeRepresentation = (representationType) => {
            const rep = (representationType || 'cartoon').toLowerCase();
            if (rep === 'molecular-surface' || rep === 'molecular_surface' || rep === 'surface') {
                return { type: 'surface', surface_type: 'molecular' };
            }
            if (rep === 'gaussian-surface' || rep === 'gaussian_surface' || rep === 'gaussian') {
                return { type: 'surface', surface_type: 'gaussian' };
            }
            if (rep === 'spacefill' || rep === 'space-filling' || rep === 'space_filling') {
                return { type: 'spacefill' };
            }
            return { type: rep || 'cartoon' };
        };

        let currentColorThemeName = "sequence-id";
        let currentColorThemeParams = {
            carbonColor: { name: "sequence-id", params: {} }
        };

        const buildMvsData = (pdbId, representationType) => {
            const representationParams = normalizeRepresentation(representationType);
            const colorThemeName = currentColorThemeName;
            const colorThemeParams = currentColorThemeParams;
            return ({
            kind: "multiple",
            metadata: {
                title: "Christopher Ing - Molecular Field Notes",
                timestamp: new Date().toISOString(),
                version: "1"
            },
            snapshots: [
                {
                    root: {
                        kind: "root",
                        children: [
                            {
                                kind: "canvas",
                                params: { background_color: currentBgColor },
                                custom: {
                                    molstar_postprocessing: {
                                        enable_ssao: true,
                                        ssao_params: {
                                            samples: 32,
                                            radius: 5,
                                            bias: 1,
                                            blurKernelSize: 11,
                                            blurDepthBias: 0.5,
                                            resolutionScale: 1,
                                            color: "0x000000",
                                            transparentThreshold: 0.4
                                        }
                                    }
                                }
                            },
                            {
                                kind: "download",
                                params: {
                                    url: `https://www.ebi.ac.uk/pdbe/entry-files/download/${pdbId}.bcif`
                                },
                                children: [
                                    {
                                        kind: "parse",
                                        params: { format: "bcif" },
                                        children: [
                                            {
                                                kind: "structure",
                                                params: { type: "model" },
                                                children: [
                                                    {
                                                        kind: "component",
                                                        params: { selector: "polymer" },
                                                        children: [
                                                            {
                                                                kind: "representation",
                                                                params: representationParams,
                                                                children: [
                                                                    {
                                                                        kind: "color",
                                                                        params: {},
                                                                        custom: {
                                                                            molstar_color_theme_name: colorThemeName,
                                                                            molstar_color_theme_params: colorThemeParams
                                                                        }
                                                                    }
                                                                ]
                                                            },
                                                            {
                                                                kind: "focus",
                                                                params: {
                                                                    direction: [1, 0.6, 1.2],
                                                                    up: [0, 1, 0],
                                                                    radius_factor: 1.25,
                                                                    radius_extent: 5
                                                                }
                                                            }
                                                        ]
                                                    },
                                                    {
                                                        kind: "component",
                                                        params: { selector: "ligand" },
                                                        children: [
                                                            {
                                                                kind: "representation",
                                                                params: { type: "ball_and_stick" },
                                                                children: [
                                                                    { kind: "color", params: { color: "#d07a37" } }
                                                                ]
                                                            }
                                                        ]
                                                    }
                                                ]
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    },
                    metadata: {
                        key: "intro",
                        title: "Christopher Ing",
                        description: "# Kaleidoscope Field\\n\\nThe Mol* protein viewer is the live source for the kaleidoscope.\\nUse the controls to shape slices, spin, and color flow.\\n",
                        linger_duration_ms: 12000,
                        transition_duration_ms: 800
                    }
                }
            ]
        });
        };

        const queryParams = new URLSearchParams(window.location.search);
        let currentPdb = (queryParams.get("pdb") || "1cbs").toLowerCase();
        let currentRepresentation = queryParams.get("rep") || "cartoon";
        const initialBg = (queryParams.get("bg") || "default").toLowerCase();
        let illustrativeEnabled = queryParams.get("illustrative") === "1";
        let illustrativeApplied = false;
        let basePostprocessing = null;
        let baseIgnoreLight = null;
        const DEFAULT_BG_HEX = "#f5efe7";
        const DEFAULT_BG_INT = 0xf5efe7;
        let currentBgColor = DEFAULT_BG_HEX;
        if (initialBg === "black") currentBgColor = "#000000";
        if (initialBg === "white") currentBgColor = "#ffffff";

        let bgAnimation = null;
        let bgLastUpdate = 0;
        const bgSpeed = 36;
        let pluginCache = null;
        let bgFailures = 0;
        let bgWarned = false;
        let useExternalBg = false;
        const DEFAULT_BG = DEFAULT_BG_INT;
        let axisTries = 0;
        let loadToken = 0;

        function disableAxes() {
            const context = mvsStories.getContext?.();
            const plugin = context?.state?.viewers?.value?.[0]?.model?.plugin;
            const canvas3d = plugin?.canvas3d;
            if (!canvas3d?.setProps || !canvas3d?.props) return false;

            const current = canvas3d.props;
            const nextProps = {
                ...current,
                camera: {
                    ...current.camera,
                    helper: {
                        ...current.camera?.helper,
                        axes: { name: 'off', params: {} },
                    },
                },
            };
            canvas3d.setProps(nextProps);
            return true;
        }

        function tryDisableAxes() {
            if (disableAxes()) return;
            if (axisTries < 20) {
                axisTries += 1;
                setTimeout(tryDisableAxes, 250);
            }
        }

        const reloadStory = () => {
            const data = buildMvsData(currentPdb, currentRepresentation);
            mvsStories.loadFromData(data, { format: 'mvsj' });
            pluginCache = null;
            bgFailures = 0;
            bgWarned = false;
            tryDisableAxes();
            applyDefaultBackground();
            loadToken += 1;
            illustrativeApplied = false;
            waitForStructureReady(loadToken);
        };

        reloadStory();

        

        tryDisableAxes();

        

        async function getPlugin() {
            if (pluginCache) return pluginCache;
            const ctx = mvsStories.getContext?.();
            if (ctx && typeof ctx.then === 'function') {
                const resolved = await ctx;
                pluginCache = resolved?.state?.viewers?.value?.[0]?.model?.plugin || null;
            } else {
                pluginCache = ctx?.state?.viewers?.value?.[0]?.model?.plugin || null;
            }
            return pluginCache;
        }

        const clonePostprocessing = (value) => {
            if (!value) return null;
            if (typeof structuredClone === 'function') {
                try {
                    return structuredClone(value);
                } catch (error) {
                    /* noop */
                }
            }
            try {
                return JSON.parse(JSON.stringify(value));
            } catch (error) {
                return value;
            }
        };

        async function applyIllustrativeStyle(enabled) {
            const plugin = await getPlugin();
            if (!plugin) return false;
            const manager = plugin.managers?.structure?.component;
            if (!manager) return false;

            if (baseIgnoreLight === null) {
                baseIgnoreLight = manager.state?.options?.ignoreLight ?? false;
            }
            if (!basePostprocessing && plugin.canvas3d?.props?.postprocessing) {
                basePostprocessing = clonePostprocessing(plugin.canvas3d.props.postprocessing);
            }

            if (enabled) {
                try {
                    if (manager.state?.options) {
                        await manager.setOptions({
                            ...manager.state.options,
                            ignoreLight: true,
                        });
                    }
                } catch (error) {
                    /* noop */
                }
                const canvas3d = plugin.canvas3d;
                if (canvas3d?.setProps) {
                    canvas3d.setProps({
                        postprocessing: {
                            outline: {
                                name: 'on',
                                params: {
                                    scale: 1,
                                    color: 0x000000,
                                    threshold: 0.25,
                                    includeTransparent: true,
                                },
                            },
                            occlusion: {
                                name: 'on',
                                params: {
                                    multiScale: { name: 'off', params: {} },
                                    radius: 5,
                                    bias: 0.8,
                                    blurKernelSize: 15,
                                    blurDepthBias: 0.5,
                                    samples: 32,
                                    resolutionScale: 1,
                                    color: 0x000000,
                                    transparentThreshold: 0.4,
                                },
                            },
                            shadow: { name: 'off', params: {} },
                        },
                    });
                }
                illustrativeApplied = true;
                return true;
            }

            try {
                if (manager.state?.options) {
                    await manager.setOptions({
                        ...manager.state.options,
                        ignoreLight: baseIgnoreLight ?? false,
                    });
                }
            } catch (error) {
                /* noop */
            }
            const canvas3d = plugin.canvas3d;
            if (canvas3d?.setProps && basePostprocessing) {
                canvas3d.setProps({
                    postprocessing: clonePostprocessing(basePostprocessing),
                });
            }
            illustrativeApplied = false;
            return true;
        }

        function hslToHexInt(h, s, l) {
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const hh = h / 60;
            const x = c * (1 - Math.abs((hh % 2) - 1));
            let r = 0;
            let g = 0;
            let b = 0;
            if (hh >= 0 && hh < 1) {
                r = c; g = x; b = 0;
            } else if (hh < 2) {
                r = x; g = c; b = 0;
            } else if (hh < 3) {
                r = 0; g = c; b = x;
            } else if (hh < 4) {
                r = 0; g = x; b = c;
            } else if (hh < 5) {
                r = x; g = 0; b = c;
            } else {
                r = c; g = 0; b = x;
            }
            const m = l - c / 2;
            const toByte = (v) => Math.round((v + m) * 255);
            return (toByte(r) << 16) | (toByte(g) << 8) | toByte(b);
        }

        function hexToInt(hex) {
            if (!hex) return null;
            const clean = hex.startsWith('#') ? hex.slice(1) : hex;
            if (clean.length !== 6) return null;
            const value = parseInt(clean, 16);
            return Number.isNaN(value) ? null : value;
        }

        

        let colorThemeWarned = false;

        function getStructureComponents(plugin) {
            const structures = plugin?.managers?.structure?.hierarchy?.current?.structures || [];
            const components = structures
                .flatMap((structure) => {
                    const items = structure?.components;
                    if (!items) return [];
                    return Array.isArray(items) ? items : Array.from(items);
                })
                .filter((component) => {
                    const reps = component?.representations;
                    return reps && typeof reps[Symbol.iterator] === 'function';
                });
            return components;
        }

        async function applyColorTheme(themeName, themeParams) {
            const plugin = await getPlugin();
            if (!plugin) return false;
            const manager = plugin.managers?.structure?.component;
            if (!manager?.updateRepresentationsTheme) return false;
            try {
                const components = getStructureComponents(plugin);
                if (!components.length) return false;
                await manager.updateRepresentationsTheme(components, {
                    color: themeName || "default",
                    colorParams: themeParams || {}
                });
                return true;
            } catch (error) {
                if (!colorThemeWarned) {
                    console.warn('Mol* color theme update failed.', error);
                    colorThemeWarned = true;
                }
                return false;
            }
        }

        function applyActiveTheme() {
            applyColorThemeWithRetry(currentColorThemeName, currentColorThemeParams);
        }

        function applyColorThemeWithRetry(themeName, themeParams) {
            let attempts = 0;
            const attempt = async () => {
                const ok = await applyColorTheme(themeName, themeParams);
                if (ok || attempts > 6) return;
                attempts += 1;
                setTimeout(attempt, 180);
            };
            attempt();
        }

        function updateAxisCover(color) {
            const cover = document.getElementById('axis-cover');
            if (cover) cover.style.background = color || DEFAULT_BG_HEX;
        }

        async function setBackgroundColor(color) {
            const plugin = await getPlugin();
            if (!plugin?.canvas3d?.props) return false;

            const currentProps = plugin.canvas3d.props;
            const renderer = currentProps.renderer || {};

            if (plugin.canvas3d.setProps) {
                plugin.canvas3d.setProps({
                    ...currentProps,
                    renderer: { ...renderer, backgroundColor: color },
                });
                return true;
            }

            if (plugin.canvas3d.renderer?.setProps) {
                plugin.canvas3d.renderer.setProps({ backgroundColor: color });
                return true;
            }

            return false;
        }

        async function applyDefaultBackground() {
            useExternalBg = true;
            stopBackgroundCycle();
            updateAxisCover(currentBgColor);
            const desired = currentBgColor === DEFAULT_BG_HEX ? DEFAULT_BG : hexToInt(currentBgColor);
            const targetColor = desired == null ? DEFAULT_BG : desired;
            let tries = 0;
            const attempt = async () => {
                const ok = await setBackgroundColor(targetColor);
                if (ok || tries > 40) return;
                tries += 1;
                setTimeout(attempt, 200);
            };
            attempt();
        }

        function stopBackgroundCycle() {
            if (bgAnimation) {
                cancelAnimationFrame(bgAnimation);
                bgAnimation = null;
            }
        }

        function startBackgroundCycle() {
            if (bgAnimation || useExternalBg) return;
            const animate = async () => {
                const plugin = await getPlugin();
                if (!plugin) {
                    bgFailures += 1;
                    bgAnimation = requestAnimationFrame(animate);
                    return;
                }
                const now = performance.now();
                if (!bgLastUpdate || now - bgLastUpdate > 50) {
                    const hue = (now * 0.001 * bgSpeed) % 360;
                    const color = hslToHexInt(hue, 0.9, 0.5);
                    const ok = await setBackgroundColor(color);
                    if (!ok) {
                        bgFailures += 1;
                        if (!bgWarned && bgFailures > 120) {
                            console.warn('Mol* background color update failed after repeated attempts.');
                            bgWarned = true;
                        }
                    }
                    bgLastUpdate = now;
                }
                bgAnimation = requestAnimationFrame(animate);
            };
            bgAnimation = requestAnimationFrame(animate);
        }

        async function waitForStructureReady(token) {
            if (token !== loadToken) return;
            const plugin = await getPlugin();
            const structures = plugin?.managers?.structure?.hierarchy?.current?.structures || [];
            if (structures.length) {
                applyActiveTheme();
                if (illustrativeEnabled && !illustrativeApplied) {
                    applyIllustrativeStyle(true);
                }
                if (!illustrativeEnabled && illustrativeApplied) {
                    applyIllustrativeStyle(false);
                }
                return;
            }
            setTimeout(() => waitForStructureReady(token), 200);
        }

        const handleForeground = (data) => {
            if (!data) return;
            if (data.mode === 'sequence') {
                currentColorThemeName = "sequence-id";
                currentColorThemeParams = {
                    carbonColor: { name: "sequence-id", params: {} }
                };
                applyActiveTheme();
            }
            if (data.mode === 'uniform' && typeof data.color === 'string') {
                const colorInt = hexToInt(data.color);
                if (colorInt !== null) {
                    currentColorThemeName = "uniform";
                    currentColorThemeParams = { value: colorInt, color: colorInt };
                    applyActiveTheme();
                }
            }
        };

        window.__mvsSetForeground = (payload) => {
            handleForeground(payload);
        };

        const handleIllustrative = (enabled) => {
            const next = Boolean(enabled);
            if (next === illustrativeEnabled) return;
            illustrativeEnabled = next;
            applyIllustrativeStyle(illustrativeEnabled);
            waitForStructureReady(loadToken);
        };

        window.addEventListener('message', async (event) => {
            const data = event.data || {};
            if (data.type === 'set-structure') {
                if (typeof data.pdb === 'string' && data.pdb.trim()) {
                    currentPdb = data.pdb.trim().toLowerCase();
                }
                if (typeof data.representation === 'string' && data.representation.trim()) {
                    currentRepresentation = data.representation.trim();
                }
                reloadStory();
            }
            if (data.type === 'set-bg') {
                if (data.mode === 'static' && typeof data.color === 'string') {
                    useExternalBg = true;
                    stopBackgroundCycle();
                    currentBgColor = data.color === 'default' ? DEFAULT_BG_HEX : data.color;
                    updateAxisCover(currentBgColor);
                    applyDefaultBackground();
                    return;
                }
                if (data.mode === 'hsl' && typeof data.hue === 'number') {
                    useExternalBg = true;
                    stopBackgroundCycle();
                    const hue = ((data.hue % 360) + 360) % 360;
                    const saturation = 1;
                    const lightness = typeof data.lightness === 'number' ? data.lightness : 0.35;
                    const color = hslToHexInt(hue, saturation, lightness);
                    currentBgColor = `#${color.toString(16).padStart(6, '0')}`;
                    updateAxisCover(currentBgColor);
                    let tries = 0;
                    const attempt = async () => {
                        const ok = await setBackgroundColor(color);
                        if (ok || tries > 20) return;
                        tries += 1;
                        setTimeout(attempt, 150);
                    };
                    attempt();
                }
            }
            if (data.type === 'set-foreground') {
                handleForeground(data);
            }
            if (data.type === 'set-illustrative') {
                handleIllustrative(data.enabled);
            }
        });
    

        document.getElementById('mvs-data').addEventListener('click', (e) => {
            e.preventDefault();
            mvsStories.downloadCurrentStory();
        });
    </script>
</body>
</html>
